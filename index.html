<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">

<title>İpsala'dan Prizren'e — TIR Yolculuğu Belgeseli</title>
<style>

html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#000;overflow:hidden}
#c{position:absolute;left:0;top:0;width:1920px;height:1080px}
#sub{position:absolute;left:200px;right:200px;bottom:104px;text-align:center;font-size:40px;line-height:1.38;font-weight:600;text-shadow:0 2px 6px #000,0 0 14px #000;pointer-events:none}
#sub span{background:rgba(0,0,0,.6);padding:3px 18px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

button,select{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:10px;padding:8px 18px;cursor:pointer}
button:hover{background:rgba(255,255,255,.28)}
select{max-width:260px}
select option{color:#000}
input[type=range]{width:150px;accent-color:#e0412f}
#status{font-size:16px;color:#aab8c6;max-width:430px;line-height:1.25}
#start{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#18364f,#050a10 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;z-index:5}
#start h1{font-size:78px;margin:0;letter-spacing:2px}
#start h2{font-size:30px;margin:0;font-weight:400;color:#9fc3e6}
#start p{font-size:24px;max-width:1250px;margin:0;color:#b9cadb;line-height:1.45}
#go{font-size:40px;padding:22px 64px;background:#e0412f;border:none;border-radius:16px;font-weight:700;box-shadow:0 10px 40px rgba(224,65,47,.55)}
#go:hover{background:#f25a47}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="sub"></div>
  <div id="bar">
    <button id="btnPlay">⏸ Durdur</button>
    <button id="btnReplay">⟲ Yeniden Oynat</button>
    <button id="btnMute">🔊 Ses Açık</button>
    <label>Ses seviyesi <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <select id="voiceSel" title="Türkçe ses"><option value="">Otomatik Türkçe ses</option></select>
    <span id="status"></span>
  </div>
  <div id="start">
    <h2>BELGESEL · TIR YOLCULUĞU</h2>
    <h1>İPSALA'DAN PRİZREN'E</h1>
    <p>Türkiye · Yunanistan · Kuzey Makedonya · Kosova<br>Türkçe seslendirme, ortam sesleri ve altyazı ile. Tarayıcılar sesi otomatik başlatmadığı için lütfen aşağıdaki düğmeye basın.</p>
    <button id="go">▶ Videoyu Sesli Başlat</button>
    <p id="ttsWarn" style="font-size:20px;color:#f0b27a"></p>
  </div>
</div>

<script>
(()=>{
'use strict';
/* ================= TEMEL ================= */
const W=1920,H=1080;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform='translate('+((innerWidth-W*s)/2)+'px,'+((innerHeight-H*s)/2)+'px) scale('+s+')';}
addEventListener('resize',fit);fit();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function rng(seed){let s=((seed*2654435761)>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const pad2=n=>(n<10?'0':'')+n;

/* ================= BAYRAKLAR ================= */
function star(x,y,r,n,rot,fill){ctx.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,rr2=i%2?r*0.382:r;ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}ctx.closePath();ctx.fillStyle=fill;ctx.fill();}

const WP=[

 ['İskeçe',24.89,41.14,165,'c','a2'],['Kavala',24.41,40.94,220,'c','a2'],['Selanik',22.94,40.64,362,'c','a2'],['Evzoni',22.52,41.12,432,'b','a1g'],

const TOTAL_KM=745;
function posAt(km){km=clamp(km,0,TOTAL_KM);for(let i=1;i<WP.length;i++){if(km<=WP[i][3]){const a=WP[i-1],b=WP[i],t=(km-a[3])/(b[3]-a[3]||1);return{lon:lerp(a[1],b[1],t),lat:lerp(a[2],b[2],t),hw:b[5]};}}const l=WP[WP.length-1];return{lon:l[1],lat:l[2],hw:l[5]};}

function drawMap(px,py,mw,km,o){
  o=o||{};const kx=mw/6.4,ky=kx*1.335,mh=2.3*ky;
  const X=lon=>px+(lon-20.4)*kx,Y=lat=>py+(42.7-lat)*ky;
  ctx.save();ctx.beginPath();ctx.rect(px,py,mw,mh);ctx.clip();
  const sg=ctx.createLinearGradient(0,py,0,py+mh);sg.addColorStop(0,'#10304a');sg.addColorStop(1,'#0a2236');ctx.fillStyle=sg;ctx.fillRect(px,py,mw,mh);
  ctx.lineJoin='round';

  ctx.fillText('TÜRKİYE',X(26.5),Y(41.55));ctx.fillText('YUNANİSTAN',X(23.9),Y(41.28));ctx.fillText('KUZEY MAKEDONYA',X(21.8),Y(41.42));ctx.fillText('KOSOVA',X(21.0),Y(42.58));

    ctx.font=(w[4]==='b'?'bold ':'')+fs+'px '+FONT;ctx.fillStyle=passed?'#fff':'rgba(255,255,255,.6)';ctx.textAlign='left';let dx=7,dy=-7;if(w[0]==='İpsala'){dx=-fs*3.2;dy=fs*1.6;}if(w[0]==='Kipi'){dx=-fs*1.4;dy=-9;}if(w[0]==='Evzoni'){dx=-fs*3.4;dy=-6;}if(w[0]==='Selanik'){dy=fs*1.5;dx=-fs*1;}if(w[0]==='Üsküp'){dx=-fs*2.8;dy=fs*1.2;}if(w[0].indexOf('Blace')===0){dx=8;dy=fs*1.6;}if(w[0]==='Prizren'){dx=-fs*3.5;dy=fs*1.5;}if(w[0]==='Kaçanik'){dx=8;dy=fs*1.1;}if(w[0]==='Ferizaj'){dx=8;dy=2;}if(w[0]==='Suhareka'){dx=-fs*4.3;dy=-5;}if(w[0]==='Shtime'){dx=-fs*0.5;dy=-9;}if(w[0]==='Veles'){dx=-fs*2.6;dy=2;}if(w[0]==='Negotino'){dx=-fs*4.4;dy=2;}if(w[0]==='Gümülcine'){dy=-9;dx=-fs*2;}if(w[0]==='İskeçe'){dy=-9;dx=-fs*1.5;}if(w[0]==='Kavala'){dy=fs*1.6;dx=-fs*1.5;}if(w[0]==='Dedeağaç'){dy=fs*1.6;dx=-fs*2;}ctx.fillText(w[0],x+dx,y+dy);});

/* ================= SES ================= */
const A={ctx:null,vol:0.8,muted:false,tunnel:false,nextChord:0,chordI:0};
function audioInit(){
  if(A.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=A.ctx=new AC();
  A.master=c.createGain();A.master.gain.value=A.muted?0:A.vol;A.master.connect(c.destination);
  A.sfxG=c.createGain();A.sfxG.gain.value=1;A.sfxG.connect(A.master);
  A.musG=c.createGain();A.musG.gain.value=0.5;A.musG.connect(A.master);
  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);let b=0;
  for(let i=0;i<d.length;i++){const w=Math.random()*2-1;b=(b+0.02*w)/1.02;d[i]=b*3.2;}
  A.noiseBuf=nb;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;
  const eg=c.createGain();eg.gain.value=0;
  const o1=c.createOscillator();o1.type='sawtooth';o1.frequency.value=42;
  const o2=c.createOscillator();o2.type='triangle';o2.frequency.value=84;
  const o3=c.createOscillator();o3.type='square';o3.frequency.value=21;
  const g3=c.createGain();g3.gain.value=0.5;
  o1.connect(lp);o2.connect(lp);o3.connect(g3);g3.connect(lp);lp.connect(eg);eg.connect(A.sfxG);
  const lfo=c.createOscillator();lfo.frequency.value=9;const lg=c.createGain();lg.gain.value=0.035;lfo.connect(lg);lg.connect(eg.gain);
  o1.start();o2.start();o3.start();lfo.start();
  A.eng={o1,o2,o3,lp,eg};
  const rs=c.createBufferSource();rs.buffer=nb;rs.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=520;bp.Q.value=0.5;const rg=c.createGain();rg.gain.value=0;rs.connect(bp);bp.connect(rg);rg.connect(A.sfxG);rs.start();
  A.road={rg};
  A.nextChord=c.currentTime+0.2;
}
function tone(f,dur,vol,type,when,f2){if(!A.ctx)return;const c=A.ctx,t=c.currentTime+(when||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.setValueAtTime(vol,t+Math.max(0.011,dur-0.03));g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(A.sfxG);o.start(t);o.stop(t+dur+0.03);}
function noiseBurst(dur,f0,f1,vol,type){if(!A.ctx)return;const c=A.ctx,t=c.currentTime;const s=c.createBufferSource();s.buffer=A.noiseBuf;const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=1;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*0.3);g.gain.linearRampToValueAtTime(0,t+dur);s.connect(f);f.connect(g);g.connect(A.sfxG);s.start(t,Math.random());s.stop(t+dur+0.05);}
const SFX={
  beep(){tone(880,0.12,0.1,'square');},

const CHORDS=[[110,164.8,220,261.6],[87.3,130.8,174.6,220],[130.8,196,261.6,329.6],[98,146.8,196,246.9]];
function scheduleChord(at){
  const c=A.ctx,ch=CHORDS[A.chordI%4];A.chordI++;
  ch.forEach(f=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.detune.value=(Math.random()-0.5)*8;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(0.03,at+2);g.gain.linearRampToValueAtTime(0,at+6.8);o.connect(g);g.connect(A.musG);o.start(at);o.stop(at+7);});
  const b=c.createOscillator(),bg=c.createGain();b.type='sine';b.frequency.value=ch[0]/2;bg.gain.setValueAtTime(0,at);bg.gain.linearRampToValueAtTime(0.07,at+1.5);bg.gain.linearRampToValueAtTime(0,at+6.5);b.connect(bg);bg.connect(A.musG);b.start(at);b.stop(at+7);
  for(let k=0;k<4;k++){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=ch[k%4]*2;const t=at+k*1.5+0.2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.025,t+0.03);g.gain.exponentialRampToValueAtTime(0.0008,t+1.3);o.connect(g);g.connect(A.musG);o.start(t);o.stop(t+1.4);}
  A.nextChord=at+6;
}
function audioUpdate(spd,moving,ended){
  if(!A.ctx)return;const t=A.ctx.currentTime,s=moving?spd:0;
  A.eng.o1.frequency.setTargetAtTime(38+s*34,t,0.2);A.eng.o2.frequency.setTargetAtTime(76+s*68,t,0.2);A.eng.o3.frequency.setTargetAtTime(19+s*17,t,0.2);

  A.road.rg.gain.setTargetAtTime(s*0.2,t,0.3);

const SS=window.speechSynthesis,ttsOK=!!SS&&typeof SpeechSynthesisUtterance!=='undefined';

function pickVoice(){
  const sel=$('voiceSel').value;voice=null;voiceMale=false;
  if(sel)voice=voices.find(v=>v.name===sel)||null;
  else{voice=voices.find(v=>MALE.test(v.name)&&!FEMALE.test(v.name))||voices.find(v=>!FEMALE.test(v.name))||voices[0]||null;}

function loadVoices(){

  voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o);});

}

const N={lines:[],i:-1,done:true,t:0,est:1,gap:0,lineDone:false,token:0,checked:false,broken:false};
const estSec=t=>t.length/13.2+0.5;
function speak(text){
  if(!ttsOK||N.broken)return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';if(voice)u.voice=voice;u.rate=0.93;u.pitch=voiceMale?1:0.72;u.volume=A.muted?0:A.vol;const tok=N.token;u.onend=u.onerror=()=>{if(tok===N.token)N.lineDone=true;};SS.speak(u);}catch(e){N.broken=true;}
}

function narrStart(lines){if(ttsOK){N.token++;try{SS.cancel();}catch(e){}}N.lines=lines;N.i=-1;N.done=false;N.gap=0;nextLine();}
function nextLine(){N.i++;if(N.i>=N.lines.length){N.done=true;setSub('');return;}const tx=N.lines[N.i];setSub(tx);N.t=0;N.est=estSec(tx);N.lineDone=false;N.checked=false;N.token++;speak(tx);}
function narrUpdate(dt){
  if(N.done)return;
  if(N.gap>0){N.gap-=dt;if(N.gap<=0)nextLine();return;}
  N.t+=dt;
  if(N.lineDone&&!N.checked){N.checked=true;if(N.t<N.est*0.28&&ttsOK&&!N.broken){N.broken=true;setStatus();}}
  const useTTS=ttsOK&&!N.broken;
  const fin=useTTS?(N.lineDone||N.t>N.est*2.6+4):N.t>=N.est;

}

  ctx.globalAlpha=1;
  const mw=1150,mx=(W-mw)/2,my=290;
  const km=lerp(0,TOTAL_KM,sm((cT-1.5)/(Math.max(3,CH[0].dur-3.5))));
  ctx.save();ctx.globalAlpha=a;const mh=drawMap(mx,my,mw,km,{});ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.strokeRect(mx,my,mw,mh);ctx.restore();
  ctx.globalAlpha=a;shadowText('Yaklaşık '+TOTAL_KM+' km (tahmini) · 4 ülke · 3 sınır geçişi',W/2,my+mh+54,'bold 34px '+FONT,'#ffd24a','center',0);ctx.globalAlpha=1;
}

/* ================= HUD ================= */
function fmtH(h){const m=Math.round(h*60);return pad2(Math.floor(m/60))+' sa '+pad2(m%60)+' dk';}
function drawHUD(ch,p,km){
  /* harita paneli */
  const x=1288,y=28,w=604,mw=560;ctx.fillStyle='rgba(6,14,24,.82)';rr(x,y,w,508,16);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.stroke();
  shadowText('GÜZERGÂH HARİTASI',x+22,y+26,'bold 16px '+FONT,'#9fc3e6','left',0);
  const mh=drawMap(x+22,y+36,mw,km,{});ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.5;ctx.strokeRect(x+22,y+36,mw,mh);
  let ly=y+36+mh+22;const keys=Object.keys(HW);keys.forEach((k,i)=>{const cx=x+22+(i%2)*285,cy=ly+Math.floor(i/2)*22;ctx.fillStyle=HW[k][1];ctx.fillRect(cx,cy-9,22,5);ctx.fillStyle='#d5e2ef';ctx.font='14px '+FONT;ctx.textAlign='left';ctx.fillText(HW[k][0],cx+30,cy);});
  ly+=Math.ceil(keys.length/2)*22+14;
  const hrs=km/70+bordersDone*0.75;
  ctx.fillStyle='#fff';ctx.font='bold 22px '+FONT;ctx.textAlign='left';ctx.fillText('KM '+Math.round(km)+' / '+TOTAL_KM+'   ·   Kalan '+Math.max(0,Math.round(TOTAL_KM-km)),x+22,ly+6);
  ctx.fillStyle='#ffd24a';ctx.font='bold 20px '+FONT;ctx.fillText('Süre (tahmini): '+fmtH(hrs)+'   ·   Hız: '+Math.round(spdKmh)+' km/s',x+22,ly+34);
  /* ülke rozeti */
  const cc=ch.cc?(ch.cc.length>1?(p<0.6?ch.cc[0]:ch.cc[1]):ch.cc[0]):null;
  if(cc){ctx.fillStyle='rgba(6,14,24,.75)';rr(40,34,330,64,12);ctx.fill();flag(cc,52,46,64,42);shadowText(CNAME[cc],128,78,'bold 26px '+FONT,'#fff','left',0);}
  /* bölüm başlığı */
  const el=chT;if(el<6.5&&ci>0){const k=sm(el/0.6)*(1-sm((el-5.5)/0.9));ctx.save();ctx.globalAlpha=k;ctx.fillStyle='rgba(6,14,24,.7)';rr(40,110,640,118,14);ctx.fill();shadowText('BÖLÜM '+ci+' / '+(CH.length-1),62,146,'bold 20px '+FONT,'#9fc3e6','left',0);shadowText(ch.title,62,196,'bold 38px '+FONT,'#fff','left',0);ctx.restore();}
  /* bayrak afişi */
  if(banner){const e=chT-banner.t0;if(e<4.4){const k=e<0.7?sm(e/0.7):e>3.7?1-sm((e-3.7)/0.7):1;ctx.save();ctx.globalAlpha=k;ctx.translate(0,-(1-k)*60);ctx.fillStyle='rgba(6,14,24,.78)';rr(W/2-300,40,600,360,20);ctx.fill();ctx.strokeStyle='#ffd24a';ctx.lineWidth=4;ctx.stroke();flag(banner.c,W/2-190,64,380,253);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.strokeRect(W/2-190,64,380,253);shadowText(CNAME[banner.c],W/2,368,'bold 44px '+FONT,'#fff','center',0);shadowText(banner.c==='TR'?'YOLCULUĞUN BAŞLANGICI':'ÜLKEYE GİRİŞ','W/2'.length?W/2:0,394,'20px '+FONT,'#ffd24a','center',0);ctx.restore();}}
  /* alt üçte bir: şehir */
  if(lower){const e=chT-lower.t0;if(e<5){const k=e<0.6?sm(e/0.6):e>4.3?1-sm((e-4.3)/0.7):1;ctx.save();ctx.globalAlpha=k;ctx.translate(-(1-k)*90,0);ctx.fillStyle='rgba(6,14,24,.85)';rr(40,792,600,104,14);ctx.fill();ctx.fillStyle='#e0412f';ctx.fillRect(40,792,10,104);shadowText(lower.name,70,842,'bold 44px '+FONT,'#fff','left',0);shadowText(lower.sub,70,874,'22px '+FONT,'#cfe0f5','left',0);shadowText('KM '+lower.km,620,842,'bold 26px '+FONT,'#ffd24a','right',0);ctx.restore();}}
}

/* ================= RENDER ================= */
let vig=null;
function render(){
  ctx.clearRect(0,0,W,H);
  if(ci<0){drawIntro(0,0);return;}
  const ch=CH[ci],p=curP(),cT=chT;
  let km=kmOf(ch,p);
  const zoom=1+0.02*sm(p);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);
  if(ch.mode==='title')drawIntro(p,cT);
  else if(ch.mode==='border')drawBorder(ch,p,cT);
  else if(ch.mode==='road')drawRoad(ch,p,cT);
  else drawFinale(p,cT);
  ctx.restore();
  if(!vig){vig=ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*0.98);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.5)');}
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  if(ch.mode!=='title')drawHUD(ch,p,km);
  let f=0;if(phase==='in')f=1-sm(phT/0.9);else if(phase==='out')f=sm(phT/0.7);
  if(f>0.001){ctx.fillStyle='rgba(0,0,0,'+f+')';ctx.fillRect(0,0,W,H);}
  if(ended){ctx.fillStyle='rgba(0,0,0,.0)';}
}

/* ================= DÖNGÜ ================= */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000||0));last=ts;
  if(started&&!paused&&ci>=0){perfT+=dt;update(dt);}
  else if(!started)perfT+=dt;
  render();
}
requestAnimationFrame(frame);

/* ================= KONTROLLER ================= */
$('go').addEventListener('click',startVideo);
$('btnPlay').addEventListener('click',()=>{if(!started){startVideo();return;}if(ended){replay();return;}setPaused(!paused);});
$('btnReplay').addEventListener('click',replay);
$('btnMute').addEventListener('click',()=>{A.muted=!A.muted;$('btnMute').textContent=A.muted?'🔇 Ses Kapalı':'🔊 Ses Açık';if(A.ctx)applyVol();if(A.muted&&ttsOK){/* mevcut cümleyi sustur: tekrar başlat */}});
$('vol').addEventListener('input',e=>{A.vol=parseFloat(e.target.value);if(A.ctx)applyVol();});
$('voiceSel').addEventListener('change',pickVoice);
addEventListener('keydown',e=>{if(e.code==='Space'&&started){e.preventDefault();if(ended)replay();else setPaused(!paused);}});
if(ttsOK){loadVoices();SS.onvoiceschanged=loadVoices;}else{$('ttsWarn').textContent='Bu tarayıcı konuşma sentezini desteklemiyor; Chrome veya Edge önerilir. Altyazı ve ses efektleri yine de çalışır.';}
setStatus();
/* test için */
window.__doc={CH,gotoChapter,update,render,startVideo};
})();
</script>
